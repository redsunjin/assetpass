<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Asset Passport MVP — GIWA Sepolia RWA evidence registry" />
    <title>Asset Passport — MVP 데모</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">GIWA Sepolia · MVP 데모</p>
          <h1>Asset Passport</h1>
          <p class="subtitle">문서 해시·검토·공시 상태를 확인하는 가상 자산 증빙 화면</p>
        </div>
        <button id="wallet-button" class="wallet-button" type="button">지갑 연결</button>
      </header>

      <aside class="notice" role="note">
        데모용 가상 자산입니다. 문서 해시·검토·공시 화면과 지갑 서명 흐름을 확인할 수 있습니다. 테스트넷 온체인 등록·검토·공시 트랜잭션은 현재 배포 준비 단계입니다. 투자상품·실제 권리·보관·매매·수익을 제공하거나 권유하지 않습니다.
      </aside>

      <section class="summary" aria-label="데모 요약">
        <div><span>등록 자산</span><strong id="asset-count">–</strong></div>
        <div><span>검토 대기</span><strong id="review-count">–</strong></div>
        <div><span>공시 완료</span><strong id="disclosed-count">–</strong></div>
      </section>

      <section class="workspace" aria-label="Asset Passport workspace">
        <div class="panel">
          <div class="panel-heading"><h2>자산 목록</h2><span>데모 데이터</span></div>
          <div id="asset-list" class="asset-list" aria-live="polite"></div>
        </div>
        <article id="asset-detail" class="panel detail" aria-live="polite">
          <p class="empty-state">자산을 선택하면 최신 증빙을 확인할 수 있습니다.</p>
        </article>
      </section>

      <section class="panel calendar">
        <div class="panel-heading"><h2>공시 일정</h2><span>가상 자산 기준</span></div>
        <div id="disclosure-calendar"></div>
      </section>
    </main>
    <template id="asset-template">
      <button class="asset-item" type="button">
        <span class="asset-id"></span><strong></strong><span class="status"></span>
      </button>
    </template>
    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
